project:
  type: website
  output-dir: docs
  resources:
    - files/images/pablo-zuniga.jpeg
  render:
    - index.qmd
    - research.qmd
    - teaching.qmd
    - posts.qmd
    - contact.qmd
    - 404.qmd
    - posts/workshop-fortaleza/index.qmd
    - posts/cuartiles-mayores/index.qmd

lang: en
author: "Pablo Adrián Zúñiga Guamán"
website:
  title: "Pablo Zúñiga"
  description: "I'm Pablo, from Ecuador and now in Campinas. I study probability and mathematics, and care about research and communicating science."
  site-url: "https://pabzun.github.io"
  repo-url: "https://github.com/pabzun/pabzun.github.io"
  navbar:
    background: white
    left:
      - text: About me
        href: index.qmd
      - text: Research
        href: research.qmd
      - text: Teaching
        href: teaching.qmd
      - text: Academic activities
        href: posts.qmd
      - text: Get in touch
        href: contact.qmd
    right:
      - icon: github
        href: https://github.com/pabzun
        target: _blank
  page-footer:
    left: "© Pablo Zúñiga"
    right: "Built with [Quarto](https://quarto.org/). Template by [Gang He](https://github.com/drganghe/quarto-academic-website-template)."
  search:
    location: navbar
    type: textbox
  open-graph: true
  twitter-card: true
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    link-external-newwindow: true
    email-obfuscation: javascript
